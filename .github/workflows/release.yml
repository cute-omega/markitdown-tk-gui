name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "发布到的标签（如 v1.0.0，会自动创建）。留空则只构建产物不上传。"
        required: false
        type: string

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  APP_NAME: markitdown-tk-gui

jobs:
  determine-version:
    name: Determine version tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$TAG" ]; then
            TAG=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          fi
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"

  build:
    name: Package ${{ matrix.target }}
    needs: determine-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x86_64
            ext: .exe
          - os: ubuntu-24.04
            target: linux-x86_64
            ext: ""
          - os: macos-14
            target: macos-arm64
            ext: ""

    env:
      UV_PYTHON_PREFERENCE: system

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install tkinter for Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install project dependencies
        run: uv sync

      - name: Verify tkinter is available
        run: uv run python -c "import tkinter; print('tkinter', tkinter.TkVersion)"

      - name: Build portable executable with PyInstaller
        shell: bash
        run: |
          uv run --with pyinstaller pyinstaller \
            --noconfirm --clean --onefile --windowed \
            --name "${{ env.APP_NAME }}-${{ needs.determine-version.outputs.version }}-${{ matrix.target }}" \
            --collect-all magika \
            --collect-all markitdown \
            --collect-all onnxruntime \
            --collect-all pymupdf \
            main.py

      - name: Package macOS .app bundle
        if: runner.os == 'macOS'
        run: |
          ASSET_NAME="${{ env.APP_NAME }}-${{ needs.determine-version.outputs.version }}-${{ matrix.target }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/${{ env.APP_NAME }}-${{ needs.determine-version.outputs.version }}-${{ matrix.target }}.app" "${ASSET_NAME}"

      - name: Upload artifact (macOS .app zipped)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.APP_NAME }}-${{ needs.determine-version.outputs.version }}-${{ matrix.target }}.zip
          path: ${{ env.APP_NAME }}-${{ needs.determine-version.outputs.version }}-${{ matrix.target }}.zip
          if-no-files-found: error

      - name: Upload artifact (Windows/Linux single file)
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.APP_NAME }}-${{ needs.determine-version.outputs.version }}-${{ matrix.target }}${{ matrix.ext }}
          path: dist/${{ env.APP_NAME }}-${{ needs.determine-version.outputs.version }}-${{ matrix.target }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [determine-version, build]
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify version consistency
        run: |
          TAG_VERSION="${{ needs.determine-version.outputs.version }}"
          PYPROJECT_VERSION=$(grep '^version' pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::版本不一致！tag=$TAG_VERSION, pyproject.toml=$PYPROJECT_VERSION"
            exit 1
          fi
          echo "版本校验通过: $TAG_VERSION"

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Create or update release
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.determine-version.outputs.version }}" \
            ./* \
            --title "markitdown-tk-gui ${{ needs.determine-version.outputs.version }}" \
            --generate-notes \
            --repo "${{ github.repository }}"
